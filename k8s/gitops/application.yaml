apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astroml-model-deployment
  namespace: argocd
  labels:
    app: astroml
    managed-by: gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: astroml

  source:
    repoURL: https://github.com/astroml/astroml.git
    targetRevision: HEAD
    path: k8s/gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: astroml

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: astroml
  namespace: argocd
  labels:
    managed-by: gitops
spec:
  description: AstroML model deployment project

  sourceRepos:
  - https://github.com/astroml/astroml.git

  destinations:
  - namespace: astroml
    server: https://kubernetes.default.svc
  - namespace: astroml-staging
    server: https://kubernetes.default.svc

  clusterResourceWhitelist:
  - group: ""
    kind: Namespace

  namespaceResourceWhitelist:
  - group: "apps"
    kind: Deployment
  - group: ""
    kind: ConfigMap
  - group: ""
    kind: Service
  - group: ""
    kind: PersistentVolumeClaim
  - group: "batch"
    kind: CronJob

  roles:
  - name: deploy-approver
    description: Role for approving model deployments
    policies:
    - p, proj:astroml:deploy-approver, applications, sync, astroml/*, allow
    - p, proj:astroml:deploy-approver, applications, get, astroml/*, allow
