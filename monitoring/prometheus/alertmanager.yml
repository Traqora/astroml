# Alertmanager configuration for issue #570

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Alert routing configuration
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  # Critical alerts → PagerDuty/Opsgenie
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: false

    # Warning alerts → Slack
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: false

    # Info alerts → email digest
    - match:
        severity: info
      receiver: 'info-alerts'
      continue: false

# Receiver configurations
receivers:
  - name: 'default'
    slack_configs:
      - channel: '#astroml-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}'
        severity: 'critical'
    slack_configs:
      - channel: '#astroml-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Alert:** {{ .Labels.alertname }}
          **Severity:** {{ .Labels.severity }}
          **Description:** {{ .Annotations.description }}
          **Runbook:** {{ .Labels.runbook }}
          {{ end }}

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#astroml-alerts'
        send_resolved: true
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          **Alert:** {{ .Labels.alertname }}
          **Severity:** {{ .Labels.severity }}
          **Description:** {{ .Annotations.description }}
          **Runbook:** {{ .Labels.runbook }}
          {{ end }}

  - name: 'info-alerts'
    email_configs:
      - to: 'ops-team@example.com'
        headers:
          Subject: '[INFO] {{ .GroupLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <p><strong>Alert:</strong> {{ .Labels.alertname }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          {{ end }}

# Inhibition rules to prevent alert spam
inhibit_rules:
  # If a critical alert is firing, inhibit warning alerts for the same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

# Suppression for maintenance windows
# Use labels to suppress alerts during maintenance:
# kubectl label -n astroml pod <pod-name> maintenance="true"
