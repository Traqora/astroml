name: Docker Images

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime user (api image)
        if: github.event_name == 'push'
        run: |
          IMAGE="${{env.REGISTRY}}/${{env.IMAGE_NAME}}:sha-${{github.sha}}"
          RUNTIME_USER=$(docker run --rm --entrypoint id "$IMAGE" -u)
          if [ "$RUNTIME_USER" = '0' ]; then
            echo "FAIL: api image runs as root (uid=0)"
            exit 1
          fi
          echo "PASS: api image runtime user uid=$RUNTIME_USER"

      - name: Build api image locally for user check (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker build -t astroml-api-pr-check -f api/Dockerfile .
          RUNTIME_USER=$(docker run --rm --entrypoint id astroml-api-pr-check -u)
          if [ "$RUNTIME_USER" = '0' ]; then
            echo "FAIL: api image runs as root (uid=0)"
            exit 1
          fi
          echo "PASS: api image runtime user uid=$RUNTIME_USER"
          docker rmi astroml-api-pr-check
