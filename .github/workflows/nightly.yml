name: Nightly Builds

on:
  schedule:
    # Run at 2am UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install latest dependencies (issue #558)
        run: |
          python -m pip install --upgrade pip
          # Install without version pins to test latest compatibility
          pip install --upgrade --no-cache-dir \
            fastapi \
            uvicorn[standard] \
            sqlalchemy \
            alembic \
            pandas \
            numpy \
            scikit-learn \
            torch \
            torch-geometric \
            networkx \
            pytest \
            pytest-cov \
            pytest-asyncio \
            httpx \
            redis \
            celery

      - name: Install project dependencies
        run: |
          pip install -e .

      - name: Run full test suite (issue #558)
        run: |
          pytest tests/ -v --cov=astroml --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: nightly
          name: nightly-build

      - name: Generate coverage summary
        run: |
          coverage report --format=markdown > coverage_summary.md

      - name: Create GitHub issue on failure (issue #558)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Nightly Build Failure\n\nThe nightly build failed on ${new Date().toISOString()}.\n\n**Workflow**: ${context.workflow}\n**Run**: ${context.runId}\n\nPlease check the logs for details.\n\n[View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['nightly-build', 'ci-failure']
            });
            console.log(`Created issue #${issue.data.number}`);

      - name: Post results to Slack (issue #558)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Nightly Build Status: ${{ job.status }}
            Date: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Post daily coverage report (issue #558)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage_summary.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,  # Post to a tracking issue
              body: `## Daily Coverage Report - ${new Date().toISOString().split('T')[0]}\n\n${coverage}`
            });

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: |
            coverage.xml
            htmlcov/
            coverage_summary.md
          retention-days: 7

  checkpoint-validation:
    runs-on: ubuntu-latest
    needs: nightly-build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: astroml
          POSTGRES_PASSWORD: astroml
          POSTGRES_DB: astroml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeval 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run database migrations
        env:
          ASTROML_DATABASE_URL: postgresql://astroml:astroml@localhost:5432/astroml_test
        run: |
          alembic upgrade head

      - name: Validate ingestion checkpoints
        env:
          ASTROML_DATABASE_URL: postgresql://astroml:astroml@localhost:5432/astroml_test
          ASTROML_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v \
            -k "checkpoint or state or ingestion" \
            --tb=short \
            -x

      - name: Validate stream cursor recovery
        env:
          ASTROML_DATABASE_URL: postgresql://astroml:astroml@localhost:5432/astroml_test
        run: |
          pytest tests/ -v \
            -k "cursor or stream or resume" \
            --tb=short

      - name: Validate data integrity constraints
        env:
          ASTROML_DATABASE_URL: postgresql://astroml:astroml@localhost:5432/astroml_test
        run: |
          pytest tests/ -v \
            -k "integrity or constraint or unique" \
            --tb=short

      - name: Upload checkpoint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-validation-results
          path: |
            pytest-checkpoint.log
          retention-days: 30

  performance-benchmarks:
    runs-on: ubuntu-latest
    needs: nightly-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark pytest-regressions

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ -v \
            --benchmark-only \
            --benchmark-json=benchmark_results.json \
            --benchmark-autosave \
            --benchmark-save-data \
            --benchmark-min-rounds=10

      - name: Download previous baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/baseline.json
          key: performance-baseline-${{ github.ref_name }}-${{ hashFiles('benchmarks/baseline.json') }}
          restore-keys: |
            performance-baseline-main-

      - name: Compare against baseline
        id: compare
        run: |
          if [ -f benchmarks/baseline.json ]; then
            python scripts/compare_benchmarks.py \
              --current benchmark_results.json \
              --baseline benchmarks/baseline.json \
              --threshold-warning 0.10 \
              --threshold-fail 0.20 \
              --output comparison_report.md
            echo "has_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "No baseline found, skipping comparison"
            echo "Performance benchmark results (no baseline comparison)" > comparison_report.md
            echo "" >> comparison_report.md
            cat benchmark_results.json | python -m json.tool >> comparison_report.md
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          fi

      - name: Store baseline on main branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
        run: |
          mkdir -p benchmarks
          cp benchmark_results.json benchmarks/baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline.json
          git commit -m "Update performance baseline [skip ci]" || true
          git push || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-results
          path: |
            benchmark_results.json
            comparison_report.md
          retention-days: 90

      - name: Create issue on regression
        if: steps.compare.outputs.has_baseline == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('comparison_report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Performance regression detected - ${new Date().toISOString().split('T')[0]}`,
              body: `## Performance Regression\n\n${report}\n\n[View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['performance', 'regression', 'nightly']
            });
