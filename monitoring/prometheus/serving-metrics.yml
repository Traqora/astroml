# Prometheus monitoring configuration for AstroML Model Serving
# Issue #639: Automated model serving with auto-scaling metrics
#
# Defines scrape configurations, recording rules, and alerting rules
# for model serving infrastructure metrics.

# ── Global settings ──────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: astroml
    component: serving

# ── Scrape configurations ────────────────────────────────────────────────────
scrape_configs:
  # Model serving metrics
  - job_name: "astroml-serving"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "astroml-serving.astroml.svc.cluster.local:8080"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # GPU metrics (DCGM exporter)
  - job_name: "nvidia-dcgm"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "nvidia-dcgm-exporter.astroml.svc.cluster.local:9400"

  # Node metrics (for HPA resource metrics)
  - job_name: "kubernetes-nodes"
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # Pod metrics
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: astroml-model-serving
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8080"
        action: keep

