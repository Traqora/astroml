name: Build & Publish Docs

on:
  push:
    branches: [main]
    paths:
      - "astroml/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "astroml/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install doc dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Install package dependencies
        run: |
          # Sphinx autosummary imports the real package, so this job needs the
          # same closure the code does: astroml.features -> astroml.cache ->
          # redis/cachetools, and torch_geometric -> xxhash/tqdm/aiohttp.
          # Installing torch-geometric with --no-deps (what this step used to
          # do) deliberately left those out, so every docs build died on
          # `ModuleNotFoundError: No module named 'redis'`.
          pip install -r requirements-cpu.txt

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Check documentation links
        run: python scripts/check_doc_links.py

      - name: Build HTML docs
        run: make html
        working-directory: docs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
