# SPDX-License-Identifier: MIT
name: Secrets Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for leaked secrets
        run: detect-secrets scan --baseline .secrets.baseline --all-files

      - name: Audit baseline status
        run: |
          echo "If new secrets were detected, update the baseline with:"
          echo "  detect-secrets scan --baseline .secrets.baseline"
          echo "Then commit the updated .secrets.baseline file."
