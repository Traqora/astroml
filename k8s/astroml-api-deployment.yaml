apiVersion: apps/v1
kind: Deployment
metadata:
  name: astroml-api
  namespace: astroml
  labels:
    app: astroml-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astroml-api
  template:
    metadata:
      labels:
        app: astroml-api
    spec:
      serviceAccountName: astroml
      containers:
      - name: api
        image: ghcr.io/${{ github.repository }}:production-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: astroml-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: astroml-config
              key: REDIS_URL
        - name: LLM_PROVIDER
          value: "openai"
        - name: ASTROML_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Granular probes (issue #569). The startup probe absorbs slow
        # initialisation so the liveness probe never restarts a pod that is
        # merely still booting; liveness checks only that the process is
        # responsive; readiness gates traffic on dependency health.
        startupProbe:
          httpGet:
            path: /healthz/startup
            port: 8000
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
