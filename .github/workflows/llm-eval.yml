name: LLM Evaluation

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  push:
    branches: [main, develop]
    paths:
      - "astroml/llm/eval/**"
      - "astroml/llm/prompts/**"
      - "scripts/ci/run-eval.sh"
  pull_request:
    paths:
      - "astroml/llm/eval/**"
      - "astroml/llm/prompts/**"

env:
  SCORE_THRESHOLD: 5.0

jobs:
  evaluate:
    name: Quality Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install -e . --no-deps

      - name: Run evaluation benchmarks
        run: bash scripts/ci/run-eval.sh

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-eval-results
          path: |
            .llm_eval_output.txt
            .llm_eval_baseline.json

      - name: Check quality gate
        run: |
          if [ -f .llm_eval_baseline.json ]; then
            echo "Quality baseline found — evaluation complete."
          else
            echo "No previous baseline — created new baseline."
          fi
