name: GitOps Deploy

on:
  push:
    branches: [main]
    paths:
      - k8s/gitops/**
      - astroml/deployment/**
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version to deploy (e.g. 1.2.3)"
        required: true
      environment:
        description: "Target environment"
        type: choice
        options:
          - staging
          - production
        required: true
      approval_required:
        description: "Require manual approval before sync"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ARGOCD_SERVER: argocd.astroml.example.com

jobs:
  validate-manifests:
    name: Validate GitOps Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary k8s/gitops/model-deployment.yaml

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Run GitOps manager tests
        run: pytest tests/test_gitops_manager.py -v --tb=short

  build-and-push:
    name: Build and Push Model Image
    runs-on: ubuntu-latest
    needs: validate-manifests
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=gitops-
            type=raw,value=${{ github.event.inputs.model_version || 'latest' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'staging' || github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.astroml.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Update GitOps config for staging
        run: |
          python - <<'EOF'
          import subprocess, sys
          version = "${{ needs.build-and-push.outputs.image_tag }}"
          with open("k8s/gitops/model-deployment.yaml", "r") as f:
              content = f.read()
          content = content.replace("image: ghcr.io/astroml/astroml:latest",
                                    f"image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:{version}")
          with open("k8s/gitops/model-deployment.yaml", "w") as f:
              f.write(content)
          print(f"Updated image tag to {version}")
          EOF

      - name: Commit and push GitOps manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/gitops/model-deployment.yaml
          git commit -m "gitops: update staging model image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Trigger ArgoCD sync for staging
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://${ARGOCD_SERVER}/api/v1/applications/astroml-model-deployment/sync" \
            -d '{"revision":"HEAD","prune":true,"dryRun":false}'

      - name: Wait for ArgoCD sync
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
              "https://${ARGOCD_SERVER}/api/v1/applications/astroml-model-deployment" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status']['sync']['status'])")
            echo "Sync status: ${STATUS}"
            if [ "${STATUS}" = "Synced" ]; then
              echo "ArgoCD sync complete."
              exit 0
            fi
            sleep 10
          done
          echo "ArgoCD sync timed out." && exit 1

      - name: Detect drift
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          HEALTH=$(curl -s -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            "https://${ARGOCD_SERVER}/api/v1/applications/astroml-model-deployment" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status']['health']['status'])")
          echo "Health status: ${HEALTH}"
          if [ "${HEALTH}" != "Healthy" ]; then
            echo "Drift detected: application health is ${HEALTH}" && exit 1
          fi

  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
    steps:
      - name: Await manual approval
        run: echo "Production deployment approved by ${{ github.actor }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, approve-production]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://astroml.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Update GitOps config for production
        run: |
          python - <<'EOF'
          version = "${{ needs.build-and-push.outputs.image_tag }}"
          with open("k8s/gitops/model-deployment.yaml", "r") as f:
              content = f.read()
          content = content.replace("image: ghcr.io/astroml/astroml:latest",
                                    f"image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:{version}")
          with open("k8s/gitops/model-deployment.yaml", "w") as f:
              f.write(content)
          print(f"Updated image tag to {version}")
          EOF

      - name: Commit and push GitOps manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/gitops/model-deployment.yaml
          git commit -m "gitops: promote model image ${{ needs.build-and-push.outputs.image_tag }} to production [skip ci]" || echo "No changes to commit"
          git push

      - name: Trigger ArgoCD sync for production
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://${ARGOCD_SERVER}/api/v1/applications/astroml-model-deployment/sync" \
            -d '{"revision":"HEAD","prune":true,"dryRun":false}'

      - name: Wait for ArgoCD sync
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
              "https://${ARGOCD_SERVER}/api/v1/applications/astroml-model-deployment" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status']['sync']['status'])")
            echo "Sync status: ${STATUS}"
            if [ "${STATUS}" = "Synced" ]; then
              echo "ArgoCD sync complete."
              exit 0
            fi
            sleep 10
          done
          echo "ArgoCD sync timed out." && exit 1

  rollback:
    name: Rollback via Git Revert
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [deploy-staging, deploy-production]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Revert last GitOps commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert HEAD --no-edit
          git push
          echo "Rolled back GitOps manifest to previous state."

      - name: Notify rollback
        run: |
          echo "Deployment failed. GitOps manifest rolled back via git revert."
          echo "SHA reverted: ${{ github.sha }}"
