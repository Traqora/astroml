name: E2E API Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: astroml_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:8432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Start API server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/astroml_test
          REDIS_URL: redis://localhost:6379
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvicorn api.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
        timeout-minutes: 5

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... (attempt $i/30)"
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/astroml_test
          REDIS_URL: redis://localhost:6379
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE_URL: http://localhost:8000
        run: |
          pytest tests/e2e/test_api_e2e.py \
            -v \
            --tb=short \
            --cov=api \
            --cov-report=term-missing \
            --junitxml=e2e-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: |
            e2e-test-results.xml
            .coverage

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: e2e-test-results.xml
          check_name: E2E Test Results

      - name: Comment PR with test summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = fs.existsSync('e2e-test-results.xml') ? 
              'Test results available' : 'Tests completed';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ E2E API Tests: ${results}`
            })

  flake-detection:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - uses: actions/checkout@v3

      - name: Download test results
        uses: actions/download-artifact@v3
        with:
          name: e2e-test-results

      - name: Analyze flaky tests
        run: |
          if [ -f e2e-test-results.xml ]; then
            echo "Test results found. Analyzing for flaky patterns..."
            grep -i "failed\|error" e2e-test-results.xml || echo "No failures detected"
          fi
