name: Model Deployment

# Validation of the deployment code runs on every push to main. An actual
# rollout only ever runs from a manual dispatch, and then only against the
# strategy that dispatch asked for.
on:
  push:
    branches: ["main"]
    paths:
      - "astroml/deployment/**"
      - "scripts/simulate_deployment.py"
      - "tests/test_deployment_canary_bluegreen.py"
      - "tests/test_deployment_strategies_mock_services.py"
      - "tests/test_rollback_manager.py"
      - "tests/test_gitops_manager.py"
      - ".github/workflows/model-deployment.yml"
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name to deploy"
        required: true
        type: string
        default: "astroml-fraud-graph"
      version:
        description: "Model version to deploy"
        required: true
        type: string
        default: "v2.0.0"
      stable_version:
        description: "Version to fall back to if the rollout is reverted"
        required: false
        type: string
        default: "v1.9.0"
      strategy:
        description: "Deployment strategy"
        required: true
        type: choice
        options:
          - canary
          - blue-green
          - direct
        default: canary
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: production

# Two rollouts of the same ref would fight over the same traffic weights, and a
# rollout must never be cancelled halfway through its rollback drill.
concurrency:
  group: model-deployment-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate:
    name: validate-deployment-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # astroml.deployment is stdlib-only, so the gate that protects it does not
      # need the ML stack. Installing requirements-cpu.txt together with
      # requirements-api.txt (as this job used to) dies on pip's
      # "resolution-too-deep" before a single test runs.
      - name: Install pytest and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . --no-deps

      - name: Run deployment tests
        run: |
          pytest -v --tb=short \
            tests/test_deployment_canary_bluegreen.py \
            tests/test_deployment_strategies_mock_services.py \
            tests/test_rollback_manager.py \
            tests/test_gitops_manager.py

      - name: Verify deployment module imports
        run: |
          python - <<'PY'
          from astroml.deployment.blue_green import BlueGreenManager
          from astroml.deployment.canary import CanaryManager
          from astroml.deployment.gitops_manager import GitOpsManager
          from astroml.deployment.rollback_manager import RollbackManager
          from astroml.deployment.traffic_router import TrafficRouter

          print("All deployment modules imported successfully")
          PY

  # Drives the real CanaryManager / BlueGreenManager / TrafficRouter /
  # RollbackManager / GitOpsManager against an in-process mock endpoint, so
  # traffic shifting, health gating, metric capture, automated rollback and the
  # approval gate all execute for real on the runner.
  deploy:
    name: ${{ github.event.inputs.strategy }}-deployment
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://astroml.example.com
    env:
      MODEL_NAME: ${{ github.event.inputs.model_name }}
      MODEL_VERSION: ${{ github.event.inputs.version }}
      STABLE_VERSION: ${{ github.event.inputs.stable_version }}
      STRATEGY: ${{ github.event.inputs.strategy }}
      DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: ${{ github.event.inputs.strategy }} rollout
        run: |
          STATUS=0
          python scripts/simulate_deployment.py \
            --strategy "$STRATEGY" \
            --model-name "$MODEL_NAME" \
            --version "$MODEL_VERSION" \
            --stable-version "$STABLE_VERSION" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --approver "$GITHUB_ACTOR" \
            > "$RUNNER_TEMP/rollout.md" || STATUS=$?
          {
            echo "## ${STRATEGY} rollout (${DEPLOY_ENVIRONMENT})"
            cat "$RUNNER_TEMP/rollout.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # A release is only trustworthy if the same run proves the revert path:
      # the rollout must detect a degrading endpoint and hand traffic back.
      - name: Rollback drill
        run: |
          case "$STRATEGY" in
            canary) DRILL_ARGS="--fail-after-probes 2" ;;
            blue-green) DRILL_ARGS="--fail-after-probes 1" ;;
            *) DRILL_ARGS="--failure-rate 0.2" ;;
          esac
          STATUS=0
          python scripts/simulate_deployment.py \
            --strategy "$STRATEGY" \
            --model-name "$MODEL_NAME" \
            --version "$MODEL_VERSION" \
            --stable-version "$STABLE_VERSION" \
            $DRILL_ARGS \
            --expect-rollback \
            > "$RUNNER_TEMP/rollback-drill.md" || STATUS=$?
          {
            echo "## ${STRATEGY} rollback drill"
            cat "$RUNNER_TEMP/rollback-drill.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  deploy-summary:
    name: deployment-summary
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always()
    steps:
      - name: Summarize deployment
        run: |
          {
            echo "## Model Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Model | ${MODEL_NAME} |"
            echo "| Version | ${MODEL_VERSION} |"
            echo "| Strategy | ${STRATEGY} |"
            echo "| Environment | ${DEPLOY_ENVIRONMENT} |"
            echo "| Trigger | ${GITHUB_EVENT_NAME} |"
            echo "| Initiated by | ${GITHUB_ACTOR} |"
            echo "| Validation | ${{ needs.validate.result }} |"
            echo "| Rollout | ${{ needs.deploy.result }} |"
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo ""
              echo "No rollout performed: deployments require a \`workflow_dispatch\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MODEL_NAME: ${{ github.event.inputs.model_name || 'n/a (validation only)' }}
          MODEL_VERSION: ${{ github.event.inputs.version || 'n/a' }}
          STRATEGY: ${{ github.event.inputs.strategy || 'n/a' }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'n/a' }}
