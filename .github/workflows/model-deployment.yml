name: Model Deployment

on:
  push:
    branches: ["main"]
    paths:
      - "astroml/deployment/**"
      - "astroml/models/**"
      - "astroml/serving/**"
      - ".github/workflows/model-deployment.yml"
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name to deploy"
        required: true
        type: string
      version:
        description: "Model version to deploy"
        required: true
        type: string
      strategy:
        description: "Deployment strategy"
        required: true
        type: choice
        options:
          - canary
          - blue-green
          - direct

jobs:
  validate:
    name: validate-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt -r requirements-api.txt
          python -m pip install -e . --no-deps

      - name: Run model validation tests
        run: pytest tests/ -k "model" -v --tb=short || true

      - name: Verify deployment module imports
        run: |
          python -c "
          from astroml.deployment.canary import CanaryManager
          from astroml.deployment.blue_green import BlueGreenManager
          from astroml.deployment.traffic_router import TrafficRouter
          print('All deployment modules imported successfully')
          "

  canary-deploy:
    name: canary-deployment
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ github.event.inputs.strategy == 'canary' || github.event.inputs.strategy == '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt -r requirements-api.txt
          python -m pip install -e . --no-deps

      - name: Run canary deployment
        env:
          MODEL_NAME: ${{ github.event.inputs.model_name || 'default' }}
          MODEL_VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO)
          from astroml.deployment.canary import CanaryManager, CanaryConfig
          import os

          model_name = os.environ.get('MODEL_NAME', 'default')
          version = os.environ.get('MODEL_VERSION', 'latest')

          mgr = CanaryManager()
          config = CanaryConfig(
              initial_weight=5.0,
              increment_step=10.0,
              stabilization_seconds=30.0,
              max_canary_weight=50.0,
              auto_promote=False,
          )
          dep = mgr.start_canary(model_name, version, 'stable', config)
          print(f'Canary deployment started: {dep.deployment_id}')
          print(f'Model: {model_name} v{version}')
          print(f'Initial weight: {dep.current_weight}%')
          "

  blue-green-deploy:
    name: blue-green-deployment
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ github.event.inputs.strategy == 'blue-green' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt -r requirements-api.txt
          python -m pip install -e . --no-deps

      - name: Run blue-green deployment
        env:
          MODEL_NAME: ${{ github.event.inputs.model_name || 'default' }}
          MODEL_VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO)
          from astroml.deployment.blue_green import BlueGreenManager
          import os

          model_name = os.environ.get('MODEL_NAME', 'default')
          version = os.environ.get('MODEL_VERSION', 'latest')

          mgr = BlueGreenManager()
          dep = mgr.prepare(model_name, version, 'stable')
          print(f'Blue-green deployment prepared: {dep.deployment_id}')
          print(f'Model: {model_name} v{version}')
          print(f'Active env: {dep.active_env.value}')
          "

  deploy-summary:
    name: deployment-summary
    runs-on: ubuntu-latest
    needs: [canary-deploy, blue-green-deploy]
    if: always()
    steps:
      - name: Summarize deployment
        run: |
          echo "## Model Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Model | ${{ github.event.inputs.model_name || 'default' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ github.event.inputs.version || 'latest' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Strategy | ${{ github.event.inputs.strategy || 'canary' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY