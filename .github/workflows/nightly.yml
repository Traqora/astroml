name: Nightly Builds

on:
  schedule:
    # Run at 2am UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install latest dependencies (issue #558)
        run: |
          python -m pip install --upgrade pip
          # Install without version pins to test latest compatibility
          pip install --upgrade --no-cache-dir \
            fastapi \
            uvicorn[standard] \
            sqlalchemy \
            alembic \
            pandas \
            numpy \
            scikit-learn \
            torch \
            torch-geometric \
            networkx \
            pytest \
            pytest-cov \
            pytest-asyncio \
            httpx \
            redis \
            celery

      - name: Install project dependencies
        run: |
          pip install -e .

      - name: Run full test suite (issue #558)
        run: |
          pytest tests/ -v --cov=astroml --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: nightly
          name: nightly-build

      - name: Generate coverage summary
        run: |
          coverage report --format=markdown > coverage_summary.md

      - name: Create GitHub issue on failure (issue #558)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Nightly Build Failure\n\nThe nightly build failed on ${new Date().toISOString()}.\n\n**Workflow**: ${context.workflow}\n**Run**: ${context.runId}\n\nPlease check the logs for details.\n\n[View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['nightly-build', 'ci-failure']
            });
            console.log(`Created issue #${issue.data.number}`);

      - name: Post results to Slack (issue #558)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Nightly Build Status: ${{ job.status }}
            Date: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Post daily coverage report (issue #558)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage_summary.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,  # Post to a tracking issue
              body: `## Daily Coverage Report - ${new Date().toISOString().split('T')[0]}\n\n${coverage}`
            });

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results
          path: |
            coverage.xml
            htmlcov/
            coverage_summary.md
          retention-days: 7
