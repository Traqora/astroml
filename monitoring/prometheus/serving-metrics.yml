# ── Metric instrumentation guide ─────────────────────────────────────────────
# The following custom metrics should be exposed by the model serving application
# at the /metrics endpoint:
#
# Counter metrics:
#   astroml_inference_requests_total{model, version, status}
#     - Total inference requests (labels: model, version, status=success/error)
#   astroml_inference_errors_total{model, error_type}
#     - Total inference errors (labels: model, error_type=timeout/oome/...)
#   astroml_autoscaler_scale_events_total{direction}
#     - Total scaling events (labels: direction=up/down)
#
# Histogram metrics:
#   astroml_inference_latency_seconds{model}
#     - Inference latency in seconds (buckets: 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1, 5)
#   astroml_inference_batch_size{model}
#     - Batch size distribution
#
# Gauge metrics:
#   astroml_active_replicas
#     - Current number of active replicas
#   astroml_queue_depth{model}
#     - Current inference queue depth
#   astroml_active_connections{model}
#     - Active inference connections
#   astroml_gpu_memory_used_bytes{model}
#     - GPU memory in use (if GPU-enabled)